shell=fish
title=foot
font=monospace:size=11, Noto Sans Thai:size=11
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000
multiplier=3

[cursor]
style=beam
beam-thickness=1.5
blink=yes
blink-rate=600

[colors-dark]
alpha=0.88
blur=yes

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
