<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{
    --accent:#5b8cff; --accent-soft:rgba(91,140,255,.14);
    --text:#f2f2f4; --muted:#93939c; --faint:#5c5c66;
    --card-bg:rgba(22,22,27,.86); --field-bg:rgba(255,255,255,.05);
    --field-bg-hover:rgba(255,255,255,.09); --border:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;height:100%;
    font-family:-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;
    color:var(--text);overflow:hidden;}

  #card{
    position:absolute;inset:14px;
    background:var(--card-bg);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
    border:1px solid var(--border);border-radius:22px;
    box-shadow:0 24px 70px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.35);
    display:flex;flex-direction:column;padding:20px;gap:16px;
    opacity:0;transform:scale(.96) translateY(6px);
    animation:pop .22s cubic-bezier(.2,.8,.3,1.1) forwards;
  }
  @keyframes pop{ to{opacity:1;transform:scale(1) translateY(0);} }

  #head{display:flex;align-items:center;justify-content:space-between;}
  #head h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.1px;}
  #head .sub{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:400;}
  #closeBtn{width:28px;height:28px;border-radius:9px;border:none;background:var(--field-bg);
    color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  #closeBtn:hover{background:var(--field-bg-hover);color:var(--text);}
  #closeBtn svg{width:15px;height:15px;}

  .seg{display:flex;background:var(--field-bg);border-radius:13px;padding:4px;gap:4px;}
  .seg button{flex:1;border:none;background:transparent;color:var(--muted);
    border-radius:9px;padding:9px 6px;font-size:12.5px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:7px;
    transition:background .13s,color .13s;}
  .seg button svg{width:16px;height:16px;stroke-width:2.1;}
  .seg button:hover{color:var(--text);}
  .seg button.on{background:var(--accent);color:#fff;
    box-shadow:0 3px 10px rgba(91,140,255,.35);}

  #targets{display:flex;flex-direction:column;gap:8px;}
  .tcard{display:flex;align-items:center;gap:12px;background:var(--field-bg);
    border:1.5px solid transparent;border-radius:14px;padding:11px 13px;cursor:pointer;
    transition:background .13s,border-color .13s,transform .1s;}
  .tcard:hover{background:var(--field-bg-hover);}
  .tcard:active{transform:scale(.985);}
  .tcard.on{border-color:var(--accent);background:var(--accent-soft);}
  .tcard .ic{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.06);
    display:flex;align-items:center;justify-content:center;flex:none;color:var(--text);}
  .tcard.on .ic{background:var(--accent);color:#fff;}
  .tcard .ic svg{width:18px;height:18px;stroke-width:2;}
  .tcard .label{font-size:13px;font-weight:600;}
  .tcard .desc{font-size:11px;color:var(--muted);margin-top:1px;}
  .tcard .chev{margin-left:auto;color:var(--faint);transition:transform .15s;}
  .tcard .chev svg{width:15px;height:15px;}
  .tcard.on .chev{color:var(--accent);transform:rotate(90deg);}

  .detail{max-height:0;overflow:hidden;transition:max-height .18s ease;}
  .detail.open{max-height:70px;}
  .detail-inner{padding-top:9px;}
  select{width:100%;background:var(--field-bg);color:var(--text);
    border:1px solid var(--border);border-radius:10px;padding:9px 10px;font-size:12.5px;
    appearance:none;-webkit-appearance:none;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%2393939c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>');
    background-repeat:no-repeat;background-position:right 10px center;background-size:15px;
    padding-right:32px;cursor:pointer;}
  select:hover{background-color:var(--field-bg-hover);}
  select:focus{outline:none;border-color:var(--accent);}

  #soundRow{display:none;align-items:center;gap:9px;padding:9px 12px;
    background:var(--field-bg);border-radius:12px;font-size:12.5px;cursor:pointer;user-select:none;}
  #soundRow.show{display:flex;}
  #soundRow svg{width:16px;height:16px;color:var(--muted);flex:none;}
  #soundRow input{margin-left:auto;width:34px;height:20px;appearance:none;-webkit-appearance:none;
    background:var(--field-bg-hover);border-radius:20px;position:relative;cursor:pointer;
    transition:background .15s;}
  #soundRow input:checked{background:var(--accent);}
  #soundRow input::before{content:"";position:absolute;width:16px;height:16px;border-radius:50%;
    background:#fff;top:2px;left:2px;transition:left .15s;}
  #soundRow input:checked::before{left:16px;}

  #cursorRow{display:none;align-items:center;gap:9px;padding:9px 12px;
    background:var(--field-bg);border-radius:12px;font-size:12.5px;cursor:pointer;user-select:none;}
  #cursorRow.show{display:flex;}
  #cursorRow svg{width:16px;height:16px;color:var(--muted);flex:none;}
  #cursorRow input{margin-left:auto;width:34px;height:20px;appearance:none;-webkit-appearance:none;
    background:var(--field-bg-hover);border-radius:20px;position:relative;cursor:pointer;
    transition:background .15s;}
  #cursorRow input:checked{background:var(--accent);}
  #cursorRow input::before{content:"";position:absolute;width:16px;height:16px;border-radius:50%;
    background:#fff;top:2px;left:2px;transition:left .15s;}
  #cursorRow input:checked::before{left:16px;}

  #spacer{flex:1;}

  #goBtn{border:none;border-radius:14px;background:var(--faint);color:#fff;
    padding:13px;font-size:13.5px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    opacity:.4;pointer-events:none;transition:background .15s,opacity .15s;}
  #goBtn.ready{background:var(--accent);opacity:1;pointer-events:auto;
    box-shadow:0 6px 20px rgba(91,140,255,.4);}
  #goBtn.ready:hover{background:#4879e8;}
  #goBtn svg{width:16px;height:16px;}

  #hint{text-align:center;font-size:10.5px;color:var(--faint);}
</style>
</head>
<body>

<div id="card">
  <div id="head">
    <div>
      <h1 id="titleText">จับภาพหน้าจอ</h1>
      <div class="sub" id="subText">เลือกโหมด แล้วเลือกขอบเขต</div>
    </div>
    <button id="closeBtn"></button>
  </div>

  <div class="seg" id="modeSeg">
    <button id="mode-shot" class="on"></button>
    <button id="mode-record"></button>
  </div>

  <div id="targets">
    <div class="tcard" id="t-full" data-t="full">
      <div class="ic"></div>
      <div>
        <div class="label">ทั้งหน้าจอ</div>
        <div class="desc">เลือกจอที่ต้องการ</div>
      </div>
      <div class="chev"></div>
    </div>
    <div class="detail" id="d-full"><div class="detail-inner">
      <select id="sel-monitor"></select>
    </div></div>

    <div class="tcard" id="t-window" data-t="window">
      <div class="ic"></div>
      <div>
        <div class="label">หน้าต่างแอพ</div>
        <div class="desc">เจาะจงแอพเดียว</div>
      </div>
      <div class="chev"></div>
    </div>
    <div class="detail" id="d-window"><div class="detail-inner">
      <select id="sel-window"></select>
    </div></div>

    <div class="tcard" id="t-region" data-t="region">
      <div class="ic"></div>
      <div>
        <div class="label">เลือกพื้นที่</div>
        <div class="desc">ลากคลุมส่วนที่ต้องการ</div>
      </div>
      <div class="chev"></div>
    </div>
  </div>

  <label id="soundRow">
    <span id="soundIcon"></span>
    <span>บันทึกเสียงด้วย</span>
    <input type="checkbox" id="soundChk">
  </label>

  <label id="cursorRow">
    <span id="cursorIcon"></span>
    <span>แสดงเมาส์ในภาพ</span>
    <input type="checkbox" id="cursorChk">
  </label>

  <div id="spacer"></div>
  <button id="goBtn"><span id="goLabel">ถ่ายภาพ</span></button>
  <div id="hint">Esc ปิด · Ctrl+Alt+R หยุดอัดหน้าจอ</div>
</div>

<script>
const ICONS = {
  close: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
  video: '<path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
  monitor: '<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',
  window: '<rect x="3" y="5" width="18" height="14" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><circle cx="6.5" cy="7" r=".6" fill="currentColor" stroke="none"/>',
  crop: '<path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/>',
  chev: '<path d="m9 18 6-6-6-6"/>',
  volume: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>',
  circle: '<circle cx="12" cy="12" r="6" fill="currentColor" stroke="none"/>',
  cursor: '<path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="m13 13 6 6"/>',
};
const svg = (name, extra='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" ${extra}>${ICONS[name]}</svg>`;
document.getElementById('closeBtn').innerHTML = svg('close');
document.getElementById('mode-shot').innerHTML = svg('camera') + ' ภาพหน้าจอ';
document.getElementById('mode-record').innerHTML = svg('video') + ' อัดหน้าจอ';
document.querySelector('#t-full .ic').innerHTML = svg('monitor');
document.querySelector('#t-window .ic').innerHTML = svg('window');
document.querySelector('#t-region .ic').innerHTML = svg('crop');
document.querySelectorAll('.chev').forEach(c => c.innerHTML = svg('chev'));
document.getElementById('soundIcon').innerHTML = svg('volume');
document.getElementById('cursorIcon').innerHTML = svg('cursor');

const bridge = (obj) => window.webkit.messageHandlers.bridge.postMessage(JSON.stringify(obj));

const MONITORS = __MONITORS_JSON__;
const WINDOWS = __WINDOWS_JSON__;
const FOCUSED_MONITOR = __FOCUSED_MONITOR_JSON__;
const FOCUSED_WINDOW = __FOCUSED_WINDOW_JSON__;

const monSel = document.getElementById('sel-monitor');
MONITORS.forEach(m => {
  const o = document.createElement('option');
  o.value = m.name;
  o.textContent = `${m.name} — ${m.width}×${m.height}${m.focused ? ' (ปัจจุบัน)' : ''}`;
  if (m.name === FOCUSED_MONITOR) o.selected = true;
  monSel.appendChild(o);
});

const winSel = document.getElementById('sel-window');
WINDOWS.forEach(w => {
  const o = document.createElement('option');
  o.value = w.address;
  const title = w.title.length > 34 ? w.title.slice(0,34)+'…' : w.title;
  o.textContent = `${title} — ${w.class}`;
  if (w.address === FOCUSED_WINDOW) o.selected = true;
  winSel.appendChild(o);
});
if (!WINDOWS.length) {
  winSel.innerHTML = '<option>ไม่พบหน้าต่างที่เปิดอยู่</option>';
}

let mode = 'shot';   // 'shot' | 'record'
let target = null;   // 'full' | 'window' | 'region'

function setMode(m){
  mode = m;
  document.getElementById('mode-shot').classList.toggle('on', m==='shot');
  document.getElementById('mode-record').classList.toggle('on', m==='record');
  document.getElementById('soundRow').classList.toggle('show', m==='record');
  document.getElementById('cursorRow').classList.toggle('show', m==='shot');
  document.getElementById('titleText').textContent = m==='shot' ? 'จับภาพหน้าจอ' : 'อัดหน้าจอ';
  updateGoLabel();
}
document.getElementById('mode-shot').onclick = ()=>setMode('shot');
document.getElementById('mode-record').onclick = ()=>setMode('record');
setMode(mode);   // sync rows (cursorRow etc) to initial state -- HTML only marks the button "on"

function setTarget(t){
  target = t;
  document.querySelectorAll('.tcard').forEach(c => c.classList.toggle('on', c.dataset.t===t));
  document.getElementById('d-full').classList.toggle('open', t==='full');
  document.getElementById('d-window').classList.toggle('open', t==='window');
  document.getElementById('subText').textContent =
    t==='full' ? 'เลือกจอ แล้วกดปุ่มด้านล่าง' :
    t==='window' ? 'เลือกแอพ แล้วกดปุ่มด้านล่าง' :
    'ลากคลุมพื้นที่หลังกดปุ่ม';
  updateGoLabel();
  document.getElementById('goBtn').classList.add('ready');
}
document.getElementById('t-full').onclick = ()=>setTarget('full');
document.getElementById('t-window').onclick = ()=>setTarget('window');
document.getElementById('t-region').onclick = ()=>setTarget('region');

function updateGoLabel(){
  const verb = mode==='shot' ? 'ถ่ายภาพ' : 'เริ่มอัด';
  const suffix = target==='region' ? ' (ลากเลือกพื้นที่)' : '';
  document.getElementById('goLabel').textContent = verb + suffix;
  document.getElementById('goBtn').innerHTML =
    (mode==='shot' ? svg('camera') : svg('circle')) + `<span id="goLabel">${verb}${suffix}</span>`;
}

document.getElementById('goBtn').onclick = ()=>{
  if(!target) return;
  bridge({
    action: 'go',
    mode, target,
    monitor: monSel.value,
    windowAddress: winSel.value,
    sound: document.getElementById('soundChk').checked,
    cursor: document.getElementById('cursorChk').checked,
  });
};
document.getElementById('closeBtn').onclick = ()=> bridge({action:'close'});
window.addEventListener('keydown', e=>{
  if(e.key==='Escape') bridge({action:'close'});
  if(e.key==='Enter' && target) document.getElementById('goBtn').click();
});
</script>
</body>
</html>
