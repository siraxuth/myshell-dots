# Keyring and auth
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Clipboard history
exec-once = wl-paste --type text --watch cliphist store
# Do NOT add -max-items here: cliphist has one shared bucket, so a per-image cap
# trims the whole history (tested: 30 entries -> 20 after one capped store)
exec-once = wl-paste --type image --watch cliphist store

# Auto delete trash 30 days old
exec-once = trash-empty 30

# Cursors
exec-once = hyprctl setcursor $cursorTheme $cursorSize
exec-once = gsettings set org.gnome.desktop.interface cursor-theme '$cursorTheme'
exec-once = gsettings set org.gnome.desktop.interface cursor-size $cursorSize

# Location provider and night light
exec-once = /usr/lib/geoclue-2.0/demos/agent
exec-once = sleep 1 && gammastep

# Forward bluetooth media commands to MPRIS
exec-once = mpris-proxy

# XScreenSaver graphics only. It cannot lock securely under Wayland, so
# Caelestia/Hyprlock remains responsible for session locking.
exec-once = xscreensaver --no-splash

# Resize and move windows based on matches (e.g. pip)
exec-once = caelestia resizer -d

# Live wallpaper FIRST so it paints before caelestia's bg layer (no black flash)
# exec-once = fish -c "wallive autostart"

# Start shell
exec-once = env CAELESTIA_BOOT_LOCK=1 caelestia shell -d

# Load hyprpm plugins (dynamic-cursors → shake-to-find)
# Re-apply cursor after plugin loads — plugin takes over SW cursor rendering
exec-once = hyprpm reload -n && sleep 0.5 && hyprctl setcursor $cursorTheme $cursorSize

# Pre-warm emoji picker (resident GApplication; Super+. just raises window = instant)
exec-once = /usr/bin/python /usr/bin/smile --start-hidden

# Idle is handled by caelestia's QS IdleMonitors (Config.general.idle.timeouts), driven by the
# Control Center Power pane (per-AC/battery). hypridle is disabled to avoid double idle handling.
# exec-once = hypridle

# Keep monitor layout sane across boot, hotplug, and single-screen sessions
exec-once = /usr/bin/fish /home/siraxuth/.config/hypr/scripts/monitor-watcher.fish

# Restore VEIKK tablet mapping after monitors settle
exec-once = sleep 2 && ~/.local/bin/veikk-map-monitor "$(cat ~/.local/state/veikk-tablet/output 2>/dev/null || printf eDP-1)"
